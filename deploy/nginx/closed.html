<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>anoPod wallet: back soon</title>
  <style>
    :root {
      --bg-top: #0b1020;
      --bg-glow: #1a2147;
      --text: #eef1f8;
      --muted: #aab3cc;
      --faint: #7d87a6;
      --accent: #ff7a45;
      --light: #6ef3b0;
      --dim: #2b3350;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Thai", sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 25%, var(--bg-glow) 0%, var(--bg-top) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 560px; width: 100%; }
    svg { width: min(72vw, 300px); height: auto; display: block; margin: 0 auto 8px; overflow: visible; }
    h1 { font-size: clamp(1.5rem, 5.5vw, 2.1rem); line-height: 1.2; margin: 8px 0 12px; }
    p { font-size: 1.05rem; line-height: 1.5; color: var(--muted); margin: 0 0 10px; }
    .thai { font-size: 1.1rem; }
    .small { font-size: 0.85rem; color: var(--faint); margin-top: 18px; }

    .rocket, .flame, .flame-inner, .ring { transform-box: view-box; }
    .rocket { animation: bob 3s ease-in-out infinite; }
    .flame { transform-origin: 160px 224px; animation: flicker 0.35s ease-in-out infinite alternate; }
    .flame-inner { transform-origin: 160px 224px; animation: flicker 0.25s ease-in-out infinite alternate-reverse; }
    .star { animation: twinkle 2.6s ease-in-out infinite; }
    .ring { transform-origin: 160px 168px; animation: turn 90s linear infinite; }
    .dot { fill: var(--dim); stroke: transparent; stroke-width: 7; animation: light 6s ease-in-out infinite; }

    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes flicker { from { transform: scale(0.9, 0.75); } to { transform: scale(1.05, 1.15); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes light {
      0%, 8% { fill: var(--dim); stroke: transparent; }
      14%, 60% { fill: var(--light); stroke: rgba(110, 243, 176, 0.3); }
      70%, 100% { fill: var(--dim); stroke: transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rocket, .flame, .flame-inner, .star, .ring, .dot { animation: none; }
      .dot { fill: var(--light); }
    }
  </style>
</head>
