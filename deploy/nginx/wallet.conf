# The wallet servers' nginx site (wallet1 and wallet2, the same file): TLS for
# the three wallet names, ended here with the certificate at /etc/wallet/tls,
# behind the Hetzner balancer wallet-lb1, which passes TCP with the PROXY
# protocol. Each name is handed to its edition's wallet proxy on loopback:
# wallet.anocloud.com to 4300, attestor.wallet.anocloud.com to 4301,
# moderator.wallet.anocloud.com to 4302. Installed as
# /etc/nginx/sites-available/wallet and linked into sites-enabled by
# scripts/install-system-files.sh once the certificate exists.
#
# The three ports duplicate the PORT lines of deploy/wallet*.service on
# purpose: nginx reads no env file. Change them in both places. The body cap
# sits just above the masterpod's own limit (five images of 10 MB, times 1.4,
# plus 1 MB); the proxy timeouts sit just above the wallet proxy's 120 s, so a
# slow backend ends in the proxy's 502 JSON, not nginx's 504. Request
# buffering is off so a bucket upload streams through.

# The balancer's two addresses: the PROXY header they send carries the
# person's address, which the access log then shows instead of the balancer's.
set_real_ip_from 2.31.77.248;
set_real_ip_from 2a01:4f8:c016:b2aa::1;
real_ip_header proxy_protocol;

# Any other name, or none: the handshake needs a certificate, then the
# connection is closed without an answer.
server {
    listen 443 ssl default_server proxy_protocol;
    listen [::]:443 ssl default_server proxy_protocol;
    http2 on;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/wallet/tls/fullchain.pem;
    ssl_certificate_key /etc/wallet/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl proxy_protocol;
    listen [::]:443 ssl proxy_protocol;
    http2 on;
    server_name wallet.anocloud.com;
    server_tokens off;
    ssl_certificate /etc/wallet/tls/fullchain.pem;
    ssl_certificate_key /etc/wallet/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 72m;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    access_log /var/log/nginx/wallet-access.log;
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }
}

server {
    listen 443 ssl proxy_protocol;
    listen [::]:443 ssl proxy_protocol;
    http2 on;
    server_name attestor.wallet.anocloud.com;
    server_tokens off;
    ssl_certificate /etc/wallet/tls/fullchain.pem;
    ssl_certificate_key /etc/wallet/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 72m;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    access_log /var/log/nginx/wallet-access.log;
    location / {
        proxy_pass http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }
}

server {
    listen 443 ssl proxy_protocol;
    listen [::]:443 ssl proxy_protocol;
    http2 on;
    server_name moderator.wallet.anocloud.com;
    server_tokens off;
    ssl_certificate /etc/wallet/tls/fullchain.pem;
    ssl_certificate_key /etc/wallet/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 72m;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    access_log /var/log/nginx/wallet-access.log;
    location / {
        proxy_pass http://127.0.0.1:4302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }
}

# Port 80: everything is sent to https under the name it asked for.
server {
    listen 80 default_server proxy_protocol;
    listen [::]:80 default_server proxy_protocol;
    server_name wallet.anocloud.com attestor.wallet.anocloud.com moderator.wallet.anocloud.com;
    server_tokens off;
    access_log /var/log/nginx/wallet-access.log;
    return 301 https://$host$request_uri;
}
